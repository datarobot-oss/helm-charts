apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "admin-privileges.serviceAccountName" . }}-additional-permissions
  namespace: {{ include "admin-privileges.namespace" . }}
  labels:
    {{- include "admin-privileges.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["replicationcontrollers", "services", "serviceaccounts"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
- apiGroups: [""]
  resources: ["pods", "pods/exec", "secrets", "configmaps/status", "configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
- apiGroups: [""]
  resources: ["configmaps/finalizers"]
  verbs: ["update"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims", "networkpolicies", "endpoints", "events"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["list", "get", "watch"]
- apiGroups: ["*"]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
- apiGroups: ["apps"]
  resources: ["deployments/scale", "statefulsets/scale"]
  verbs: ["get", "list", "watch", "update", "patch", "delete"]
# Cross-product on purpose: api-gateway in DataRobot 11.12/11.13 ships this
# exact rule in its infra-manager Role (PLT-24611), and a Role can only be
# created by a user that already holds every permission in it.
- apiGroups: ["autoscaling", "policy"]
  resources: ["horizontalpodautoscalers", "poddisruptionbudgets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
- apiGroups: ["certificates.k8s.io"]
  resources: ["clustertrustbundles"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["lrs.datarobot.com"]
  resources: ["lrs"]
  verbs: ["*"]
- apiGroups: ["lrs.datarobot.com"]
  resources: ["lrs/status", "lrs/finalizers"]
  verbs: ["*"]
- apiGroups: ["batch", "extensions", "apps"]
  resources: ["jobs", "cronjobs", "ingresses"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["batch"]
  resources: ["jobs", "jobs/status"]
  verbs: ["*"]
- apiGroups: ["security.openshift.io"]
  resources: ["securitycontextconstraints"]
  resourceNames: ["nonroot", "nonroot-v2", "anyuid", "privileged", "otel-daemonset-scc-{{ include "admin-privileges.namespace" . }}"]
  verbs: ["get", "use", "list"]
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "rolebindings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["notebook.datarobot.com"]
  resources: ["notebookvolumes", "notebookvolumesnapshots"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["notebook.datarobot.com"]
  resources: ["notebooks", "services"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["notebook.datarobot.com"]
  resources: ["notebooks/finalizers", "notebookvolumes/finalizers", "notebookvolumesnapshots/finalizers"]
  verbs: ["update"]
- apiGroups: ["notebook.datarobot.com"]
  resources: ["notebooks/status", "notebookvolumes/status", "notebookvolumesnapshots/status"]
  verbs: ["get", "patch", "update"]
- apiGroups: ["monitoring.coreos.com"]
  resources: ["servicemonitors"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies", "ingresses"]
  verbs: ["*"]
- apiGroups: ["cert-manager.io"]
  resources: ["certificates", "issuers"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["predictions.datarobot.com"]
  resources: ["executionenvironments", "inferenceservers"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["predictions.datarobot.com"]
  resources: ["executionenvironments/status", "inferenceservers/status"]
  verbs: ["get", "patch", "update"]
- apiGroups: ["predictions.datarobot.com"]
  resources: ["executionenvironments/finalizers", "inferenceservers/finalizers"]
  verbs: ["update"]
# api-gateway (Envoy Gateway) is mandatory since 11.12. Its namespaced
# controller Role and the app's own Gateway/HTTPRoute/policy objects use most of
# both groups, and every Envoy Gateway upgrade adds kinds, so grant the groups.
- apiGroups: ["gateway.networking.k8s.io", "gateway.envoyproxy.io"]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["multicluster.x-k8s.io"]
  resources: ["serviceimports"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["snapshot.storage.k8s.io"]
  resources: ["volumesnapshots"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["postgresql.cnpg.io"]
  resources: ["clusters", "poolers"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# hive-handler and covalent-cloud-server grant "*" on these, so the installer
# must hold "*" too.
- apiGroups: ["apps.nvidia.com"]
  resources: ["nimservices", "nimservice", "nimcaches", "nimcache", "nimservices/finalizers"]
  verbs: ["*"]
- apiGroups: ["tokens.datarobot.com"]
  resources: ["inferenceworkloads", "inferenceworkloads/status", "tokenpools", "tokenpools/status"]
  verbs: ["*"]
- apiGroups: ["external-secrets.io"]
  resources: ["externalsecrets"]
  verbs: ["*"]
